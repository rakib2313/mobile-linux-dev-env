# Chromium flags for PRoot + low-memory devices (one flag per line, # = comment).
# Loaded through /etc/chromium.d/99-mld. Do NOT add a second --disable-features
# line: Chromium only honours the last one.
--no-sandbox
--disable-gpu
--disable-dev-shm-usage
--process-per-site
--no-first-run
--no-default-browser-check
--password-store=basic
--disable-sync
--disable-background-networking
--disable-breakpad
--disable-features=Translate,MediaRouter,OptimizationHints,AutofillServerCommunication
